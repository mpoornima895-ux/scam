name: Build APK
on:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScamSafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --legacy-peer-deps
      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
      - run: npx expo prebuild --platform android --clean
      - name: Force bundleInDebug
        run: |
          sed -i '/^react {/a\    bundleInDebug = true' android/app/build.gradle || true
          grep -A3 "^react" android/app/build.gradle || true
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
      - name: Verify APK
        run: ls -la android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: ScamSafe-APK
          path: ScamSafe/android/app/build/outputs/apk/debug/app-debug.apk
