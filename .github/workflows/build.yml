name: Build APK
on:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ScamSafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --legacy-peer-deps
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
      - run: npx expo prebuild --platform android --clean
      - name: Force JS bundle in debug build
        run: |
          sed -i 's/react {/react {\n        bundleInDebug = true/' android/app/build.gradle
          grep -A2 "react {" android/app/build.gradle
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx3g"
      - name: Verify APK exists
        run: ls -la android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: ScamSafe-APK
          path: ScamSafe/android/app/build/outputs/apk/debug/app-debug.apk
